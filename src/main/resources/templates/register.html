<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appsembly - Registro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/global.css}" />
    <link rel="stylesheet" th:href="@{/css/index.css}" />
    <style>
        .registration-card {
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-appsembly auth-nav">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/index}">APPSEMBLY</a>
        </div>
    </nav>

    <div class="container mt-5 pt-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card registration-card border-0 p-4">
                    <div class="card-body">
                        <h2 class="text-center mb-4 fw-bold">Crear una cuenta</h2>
                        
                        <!-- Mensajes de Estado -->
                        <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${error}">Error</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <div th:if="${successful != null}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            <span th:text="${successful}">¡Éxito!</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="@{/registration}" method="post">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="firstName" name="firstName" placeholder="Nombre" th:value="${firstName}" required>
                                        <label for="firstName">Nombre</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Apellido" th:value="${lastName}" required>
                                        <label for="lastName">Apellido</label>
                                    </div>
                                </div>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" th:value="${email}" required>
                                <label for="email">Correo electrónico</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" minlength="8" required>
                                <label for="password">Contraseña (Mín. 8 caracteres)</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="passwordConfirm" name="passwordConfirm" placeholder="Confirmar contraseña" minlength="8" required>
                                <label for="passwordConfirm">Confirmar contraseña</label>
                            </div>

                            <div class="form-floating mb-4">
                                <select id="role" class="form-select" name="role" required>
                                    <option value="USER">Usuario estándar</option>
                                    <option value="ADMIN">Administrador</option>
                                </select>
                                <label for="role">Tipo de cuenta</label>
                            </div>

                            <button type="submit" class="btn btn-info w-100 py-3 rounded-pill fw-bold text-white shadow-sm mb-3">Registrarse</button>

                            <div class="text-center mt-3">
                                <p class="text-muted small">¿Ya tienes una cuenta? <a th:href="@{/index}" class="text-info text-decoration-none fw-bold">Inicia sesión aquí</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
