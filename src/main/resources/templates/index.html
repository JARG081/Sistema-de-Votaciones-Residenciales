<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Appsembly</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Global CSS -->
    <link rel="stylesheet" th:href="@{/css/global.css}" />
    <link rel="stylesheet" th:href="@{/css/index.css}" />
</head>

<body>
    <!-- NAVBAR GLOBAL (sin opciones de navegación en login) -->
    <nav class="navbar navbar-expand-lg navbar-appsembly auth-nav">
        <div class="container-fluid">
            <a class="navbar-brand login-brand" th:href="@{/index}">APPSEMBLY</a>
        </div>
    </nav>

    <main class="login-page d-flex align-items-center justify-content-center">
        <section class="login-shell">
            <div class="card login-card p-4 p-md-5 bg-white">
                <h2 class="text-center mb-4 fw-bold">Inicia sesión</h2>
                <form th:action="@{/logincheck}" method="post">
                    <div th:if="${error != null}" class="alert alert-danger mb-3" role="alert">
                        <strong>Error:</strong> <span th:text="${error}"></span>
                    </div>
                    <div class="form-group mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control rounded-3" id="email" name="email" autofocus required
                            autocomplete="username" placeholder="nombre@correo.com">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control rounded-3" id="password" name="password" required
                            minlength="8" autocomplete="current-password" placeholder="Ingresa tu contraseña">
                    </div>
                    <button type="submit" class="btn bg-info rounded-5 w-100 fw-bold text-white py-2">Ingresar</button>
                    <div class="text-center mt-3">
                        <p class="mb-2"><a href="#">He olvidado mi contraseña</a></p>
                        <p class="mb-0">¿No tienes cuenta? <a th:href="@{/registration}">Regístrate aquí</a></p>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
